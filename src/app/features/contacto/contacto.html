<section class="contacto">
  <div class="contacto__intro">
    <span class="contacto__eyebrow">Estamos para ayudarte</span>
  </div>

  <div class="contacto__grid">
    <div class="contacto__map">
      <iframe
        [src]="mapSrc"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen
      >
      </iframe>
    </div>

    <div class="contacto__cards">
      <a
        class="contact-card"
        [href]="'https://maps.google.com/?q=' + address"
        target="_blank"
        rel="noopener"
      >
        <span class="contact-card__icon">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path
              fill="currentColor"
              d="M12 2C8.14 2 5 5.14 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86-3.14-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"
            />
          </svg>
        </span>
        <div>
          <span class="contact-card__label">Dirección</span>
          <span class="contact-card__value">{{ address }}</span>
        </div>
      </a>

      <a
        class="contact-card contact-card--whatsapp"
        [href]="'https://wa.me/' + phoneLink"
        target="_blank"
        rel="noopener"
      >
        <span class="contact-card__icon">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path
              fill="currentColor"
              d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.79 14.13c-.24.68-1.4 1.3-1.93 1.35-.51.05-1.02.24-3.43-.71-2.9-1.15-4.75-4.09-4.9-4.28-.14-.19-1.17-1.55-1.17-2.96s.72-2.09 1-2.38c.24-.25.53-.31.71-.31h.5c.16 0 .38-.03.58.45.24.57.81 1.98.88 2.12.07.14.11.31.02.5-.09.19-.14.31-.28.48-.14.16-.29.36-.42.49-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.93 1.94 1.22 2.22 1.36.28.14.44.12.6-.07.16-.19.68-.79.86-1.06.19-.28.37-.23.62-.14.26.1 1.63.77 1.9.91.28.14.47.21.53.33.07.13.07.71-.17 1.39z"
            />
          </svg>
        </span>
        <div>
          <span class="contact-card__label">WhatsApp</span>
          <span class="contact-card__value">{{ phone }}</span>
        </div>
      </a>
      <a
        class="contact-card contact-card--instagram"
        [href]="'https://www.instagram.com/' + instagramUser"
        target="_blank"
        rel="noopener"
      >
        <span class="contact-card__icon">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path
              fill="currentColor"
              d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"
            />
          </svg>
        </span>
        <div>
          <span class="contact-card__label">Instagram</span>
          <span class="contact-card__value">&#64;{{ instagramUser }}</span>
        </div>
      </a>

      <a class="contact-card" [href]="'mailto:' + email">
        <span class="contact-card__icon">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path
              fill="currentColor"
              d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"
            />
          </svg>
        </span>
        <div>
          <span class="contact-card__label">Email</span>
          <span class="contact-card__value">{{ email }}</span>
        </div>
      </a>
    </div>
  </div>
</section>
