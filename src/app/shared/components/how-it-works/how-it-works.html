<aside class="how-it-works">
  <h2 class="how-it-works__title">{{ title() }}</h2>

  <ol class="how-it-works__steps">
    @for (step of steps; track step.number) {
      <li class="how-it-works__step">
        <div class="how-it-works__badge">{{ step.number }}</div>
        <div class="how-it-works__text">
          <h3>{{ step.title }}</h3>
          <p class="how-it-works__subtitle">{{ step.subtitle }}</p>
          <p class="how-it-works__description">{{ step.description }}</p>
        </div>
      </li>
    }
  </ol>

  <a class="how-it-works__download" [href]="downloadUrl()" target="_blank" rel="noopener">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="7 10 12 15 17 10" />
      <line x1="12" y1="15" x2="12" y2="3" />
    </svg>
    <span>{{ downloadLabel() }}</span>
  </a>
</aside>
