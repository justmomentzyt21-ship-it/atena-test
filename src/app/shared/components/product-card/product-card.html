<article class="product-card">
  <a [routerLink]="['/ventas', product.slug]" class="product-card__link">
    <div class="product-card__image">
      <img [src]="optimizedImage" [alt]="product.name" loading="lazy" />
      <span class="product-card__type">{{ product.type }}</span>
      @if (product.discount > 0) {
        <span class="product-card__discount">-{{ product.discount }}%</span>
      }
      @if (product.stock === 0) {
        <span class="product-card__stock-badge">Sin stock</span>
      }
    </div>

    <div class="product-card__body">
      <span class="product-card__category">{{ product.category }}</span>
      <h3 class="product-card__name">{{ product.name }}</h3>
    </div>

    @if (product.type === 'venta-alquiler') {
      <div class="product-card__modality">
        <label>
          <input
            type="radio"
            name="modality-{{ product.id }}"
            value="venta"
            [checked]="selectedModality() === 'venta'"
            (change)="onModalityChange('venta')"
          />
          Venta
        </label>
        <label>
          <input
            type="radio"
            name="modality-{{ product.id }}"
            value="alquiler"
            [checked]="selectedModality() === 'alquiler'"
            (change)="onModalityChange('alquiler')"
          />
          Alquiler
        </label>
      </div>
    }
  </a>

  <button
    class="CartBtn"
    [class.added]="justAdded()"
    [class.no-stock]="product.stock === 0"
    (click)="addToCart()"
  >
    <span class="IconContainer">
      @if (justAdded()) {
        <svg viewBox="0 0 24 24" width="16" height="16" class="icon">
          <path fill="currentColor" d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="16" height="16" class="icon">
          <path
            fill="currentColor"
            d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12L8.1 13h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A.996.996 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"
          />
        </svg>
      }
    </span>
    <p class="text">
      {{
        justAdded()
          ? '¡Agregado!'
          : product.stock === 0
            ? 'Consultar disponibilidad'
            : 'Agregar al carrito'
      }}
    </p>
  </button>
</article>
